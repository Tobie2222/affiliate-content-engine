# Hạ tầng cho môi trường dev. Các cổng chỉ mở trên 127.0.0.1.
# Chạy: docker compose --env-file .env up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?hãy đặt DB_USER trong .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?hãy đặt DB_PASSWORD trong .env}
      POSTGRES_DB: ${DB_NAME:?hãy đặt DB_NAME trong .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?hãy đặt REDIS_PASSWORD trong .env}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?hãy đặt MINIO_ROOT_USER trong .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?hãy đặt MINIO_ROOT_PASSWORD trong .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
